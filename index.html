var u = false;
var f = false;
var oid = '_' + Math.random().toString(36).slice(2,10);
function s(e){ if(e){ e.preventDefault(); e.stopPropagation(); } return false; }
if(C.lock){
  document.addEventListener('keydown', function(e){
    if(e.ctrlKey && e.shiftKey && e.altKey && (e.key||'').toUpperCase() === 'K'){ u = true; }
  }, true);
}
if(C.lockPw && C.lockPwKey){
  document.addEventListener('keydown', function(e){
    if(u) return;
    if(e.ctrlKey && e.altKey && (e.key||'').toUpperCase() === 'P'){
      e.preventDefault();
      var p = prompt('');
      if(p === C.lockPwKey){ u = true; }
    }
  }, true);
}
if(C.frame){
  try{
    if(window.self !== window.top){
      document.documentElement.innerHTML = '<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#ff3b3b;font-family:system-ui;text-align:center"><div><div style="font-size:64px">&#9940;</div></div></body>';
      throw new Error('');
    }
  }catch(e){}
}
if(C.antiPrint){
  var ps = document.createElement('style');
  ps.textContent = '@media print{html,body{display:none!important}*{visibility:hidden!important}}';
  (document.head || document.documentElement).appendChild(ps);
  window.addEventListener('beforeprint', function(e){
    if(u) return;
    try{ e.preventDefault(); }catch(x){}
  });
}
if(C.blur){
  window.addEventListener('blur', function(){
    if(u) return;
    try{ document.body.style.filter = 'blur(26px)'; document.body.style.pointerEvents = 'none'; }catch(x){}
  });
  window.addEventListener('focus', function(){
    if(u) return;
    try{ document.body.style.filter = ''; document.body.style.pointerEvents = ''; }catch(x){}
  });
}
if(C.rc){
  document.addEventListener('contextmenu', function(e){ return s(e); }, true);
}
if(C.keys){
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toUpperCase();
    if(k === 'F12') return s(e);
    if((e.ctrlKey || e.metaKey) && e.shiftKey){
      if(['I','J','C','K','E','M','P'].indexOf(k) !== -1) return s(e);
    }
    if((e.ctrlKey || e.metaKey) && !e.shiftKey){
      if(k === 'U' || k === 'S' || k === 'P') return s(e);
    }
    if(k === 'PRINTSCREEN'){ try{ navigator.clipboard.writeText(''); }catch(x){} }
  }, true);
}
if(C.sel){
  var st = document.createElement('style');
  st.textContent = '*{-webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;user-select:none!important}' +
                   'input,textarea,[contenteditable]{-webkit-user-select:text!important;user-select:text!important}';
  (document.head || document.documentElement).appendChild(st);
  function isField(t){
    return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
  }
  document.addEventListener('copy', function(e){ if(!isField(e.target)) return s(e); }, true);
  document.addEventListener('cut',  function(e){ if(!isField(e.target)) return s(e); }, true);
}
if(C.drag){
  document.addEventListener('dragstart', function(e){
    var t = e.target;
    if(t && (t.tagName === 'IMG' || t.tagName === 'A')) return s(e);
  }, true);
}
function trigger(){
  if(f || u) return;
  f = true;
  var act = C.act;
  var run = function(){
    try{
      if(act === 'blank'){
        document.documentElement.innerHTML =
          '<head><meta charset="utf-8"></head>' +
          '<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d14;color:#ff4d6d;font-family:system-ui,sans-serif;text-align:center;padding:24px">' +
          '<div><div style="font-size:56px">&#9940;</div>' +
          '<h1 style="margin:12px 0;font-size:26px">Access Denied</h1></div></body>';
      }
      else if(act === 'destroy'){
        document.documentElement.innerHTML =
          '<head><meta charset="utf-8"></head>' +
          '<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#ff3b3b;font-family:system-ui,sans-serif;text-align:center;padding:24px">' +
          '<div><div style="font-size:56px">&#9760;</div>' +
          '<h1 style="margin:12px 0;font-size:26px">Access Denied</h1></div></body>';
      }
      else if(act === 'blur'){
        document.body.style.filter = 'blur(26px)';
        document.body.style.pointerEvents = 'none';
        if(!document.getElementById(oid)){
          var ov = document.createElement('div');
          ov.id = oid;
          ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2147483647;display:grid;place-items:center;color:#ff4d6d;font-family:system-ui,sans-serif;text-align:center;padding:24px';
          ov.innerHTML = '<div><div style="font-size:56px">&#9888;</div>' +
            '<h1 style="margin:12px 0;font-size:24px">Access Denied</h1></div>';
          document.body.appendChild(ov);
        }
      }
      else if(act === 'redirect'){ location.replace('about:blank'); }
      else { try{ alert('Access Denied'); }catch(x){} f = false; }
    }catch(e){}
  };
  if(document.body) run();
  else document.addEventListener('DOMContentLoaded', run);
}
var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if(C.dt && !isMobile){
  setInterval(function(){
    if(u) return;
    var w = window.outerWidth  - window.innerWidth;
    var h = window.outerHeight - window.innerHeight;
    if(window.outerWidth > 0 && (w > 170 || h > 170)) trigger();
  }, 700);
}
if(C.getter){
  var _trap = new Image();
  var _hit = false;
  try{
    Object.defineProperty(_trap, 'id', {
      get: function(){ _hit = true; return ''; }
    });
  }catch(e){}
  setInterval(function(){
    if(u) return;
    _hit = false;
    try{ console.log(_trap); }catch(x){}
    setTimeout(function(){
      if(_hit) trigger();
      try{ if(C.cl) console.clear(); }catch(x){}
    }, 80);
  }, 1000);
}
if(C.dbg){
  setInterval(function(){
    if(u) return;
    var t0 = performance.now();
    (function(){ debugger; })();
    if(performance.now() - t0 > 120) trigger();
  }, 1500);
}
if(C.cl && !C.getter){
  setInterval(function(){ try{ console.clear(); }catch(x){} }, 1000);
}
})();
